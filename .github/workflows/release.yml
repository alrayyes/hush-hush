# release-please decides the version and cuts the tag; goreleaser builds and
# attaches the binaries. A tag release-please pushes with the default
# GITHUB_TOKEN starts no further workflow (GitHub refuses, to stop recursive
# runs) — so goreleaser has to be a second job in this same workflow, gated
# on release-please's own `release_created` output, not a separate
# `on: push: tags:` workflow that would silently never fire.
name: release

on:
  push:
    branches: [main]
  # Recovery path: release-please's own job can create the release and then
  # still fail (a later API call in the same step hitting a transient rate
  # limit, say) - the job's overall failure skips goreleaser downstream even
  # though the release genuinely exists, and a later re-run of release-please
  # against that same already-tagged commit correctly finds nothing new to
  # release, so it can never legitimately re-open that gate (confirmed live,
  # alrayyes/Hush-Hush - v2.34.0 shipped with no Docker image because of
  # exactly this). Manually dispatching goreleaser alone, against an
  # already-existing tag, is the only way out that doesn't ask release-please
  # to lie about having created something it didn't just create.
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to (re)build and publish goreleaser artefacts
          for, bypassing release-please - for recovering a release whose
          goreleaser run never fired.
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Was Wandalen/wretry.action-wrapped for the transient-rate-limit
      # retry rules/releases.md documents - dropped for now because that
      # wrapper's nested-action composition doesn't actually invoke
      # release-please-action at all under GitHub's forced Node 20->24
      # runtime (2025-09-19 deprecation): the step reports success with
      # zero output and no release ever gets cut. No fixed wretry.action
      # release exists upstream (Wandalen/wretry.action#193, still open;
      # the one PR attempting it, #194, closed unmerged) - same diagnosis
      # as hush-hush-go#103 and its siblings. Re-add the wrapper once
      # upstream ships a Node 24-compatible release.
      #
      # RELEASE_TOKEN (a personal-account PAT), not a GitHub App
      # installation token: #410 tried the latter for its own,
      # independent rate-limit budget, but hit an unresolved
      # App-installation/permissions gap that left release-please
      # silently doing nothing - reverted back to the token that's
      # known to work.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

  # Each SDK repo's own codegen.yml already listens for this event
  # alongside its daily cron poll of the spec (alrayyes/hush-hush-go#65 and
  # its siblings) - this job only closes the notification gap so
  # regeneration doesn't wait up to 24h for the next cron tick. It doesn't
  # diff the spec itself: the SDK repos' own "did the spec actually move"
  # check already no-ops a release that didn't touch api/openapi.yaml, so
  # doing that twice here would just be duplicate bookkeeping.
  notify-sdks:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      matrix:
        repo: [hush-hush-go, hush-hush-python, hush-hush-node, hush-hush-php]
      fail-fast: false
    steps:
      # RELEASE_TOKEN, not the default GITHUB_TOKEN: a repository_dispatch
      # needs write access to the *target* repo, which GITHUB_TOKEN never
      # has outside the repo the workflow runs in.
      - name: Dispatch spec-updated to ${{ matrix.repo }}
        run: |
          gh api "repos/alrayyes/${{ matrix.repo }}/dispatches" \
            -f event_type=spec-updated
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  goreleaser:
    needs: release-please
    # `needs.release-please` being skipped (the workflow_dispatch path,
    # where that job's own `if` is false) would otherwise skip this job
    # too by default - always() plus an explicit check of *why* it isn't
    # simply "succeeded" is what lets a manual dispatch through the same
    # gate a real release_created still has to pass on the push path.
    if: |
      always() && !cancelled() && (
        (github.event_name == 'push' && needs.release-please.result == 'success' && needs.release-please.outputs.release_created) ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # goreleaser's own before.hooks build the frontend (cmd/hush-hush/web)
      # ahead of the Go build - needs a real bun here for the same reason
      # packaging.md's "A bun build --compile binary needs the official Bun
      # installer" note gives for a compiled Bun binary: a portable,
      # official build, not whatever a distro package happens to ship.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      # arm64 has no native runner here, so its image builds under QEMU
      # emulation - cheap now that Dockerfile.release only COPYs a binary
      # goreleaser already cross-compiled natively (go-releases.md),
      # rather than running `go build` itself under emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser-action fetches a prebuilt, checksum-verified binary
      # instead of `go install`-ing the whole tool from source on every run.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.17.1
          args: release --clean
        env:
          # goreleaser's GitHub-shaped defaults resolve here without any
          # override block - unlike the gitea_urls/force_token this repo
          # needed when it lived on Forgejo.
          #
          # RELEASE_TOKEN, not the default GITHUB_TOKEN: the same
          # anti-recursion rule notify-sdks' own comment describes for a
          # push also suppresses the `release: published` event a
          # GITHUB_TOKEN-authored release would otherwise fire, and
          # screenshots.yml needs that event to actually reach it
          # (alrayyes/hush-hush#266).
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # Free SLSA Build L2 provenance tying these binaries to this workflow
      # run - releases.md: adopt unconditionally, no cosign/SBOM needed yet.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
