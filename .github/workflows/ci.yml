# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job that needs more says so itself.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Works out which kinds of file this pull request (or push) touched, so
  # each job below can skip itself entirely instead of taking a runner just
  # to find nothing to do (rules/ci.md, "Run a check only when the files it
  # covers change"). Never filtered: `commits` here, and gitleaks.yml,
  # pr-title.yml and release.yml in their own workflows.
  #
  # A job skipped by `if:` reports Success to a required status check, so the
  # required contexts on main stay satisfied. A job skipped because THIS job
  # failed reports Success too, so `changes` has to be covered by something
  # that fails when it does: that is `all-green` at the end of this file.
  #
  # Every filter lists the files the job covers, its tool's config and
  # lockfile, and this workflow file, so editing the pipeline runs
  # everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      web-src: ${{ steps.filter.outputs.web-src }}
      web-tests: ${{ steps.filter.outputs.web-tests }}
      prose: ${{ steps.filter.outputs.prose }}
      api: ${{ steps.filter.outputs.api }}
      docker: ${{ steps.filter.outputs.docker }}
      goreleaser: ${{ steps.filter.outputs.goreleaser }}
      integration: ${{ steps.filter.outputs.integration }}
      package-json: ${{ steps.filter.outputs.package-json }}
      bun-lock: ${{ steps.filter.outputs.bun-lock }}
      ci-config: ${{ steps.filter.outputs.ci-config }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/testdata/**'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.y*ml'
              - 'api/openapi.yaml'
              - 'pacts/**'
              - 'cmd/hush-hush/web/build/**'
              - '.github/workflows/ci.yml'
            # web adds CHANGELOG.md and LICENSE, which the web build copies in
            # and a unit test parses; web-src is the sources alone, for the
            # image build, which a changelog edit can't break.
            web:
              - 'cmd/hush-hush/web/**'
              - 'api/openapi.yaml'
              - 'CHANGELOG.md'
              - 'LICENSE'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            web-src:
              - 'cmd/hush-hush/web/**'
            web-tests:
              - 'cmd/hush-hush/web/**'
              - 'internal/api/**'
              - 'api/openapi.yaml'
              - '.github/workflows/ci.yml'
            # .editorconfig is prettier's: it sets indentation, so editing it can
            # change what the prose job reports.
            prose:
              - '**/*.{md,yml,yaml}'
              - 'styles/**'
              - '.vale.ini'
              - '.markdownlint*'
              - '.prettier*'
              - '.editorconfig'
              - 'package.json'
              - 'bun.lock'
            api:
              - 'api/**'
              - 'docs/api/**'
              - 'redocly.yaml'
              - '.spectral.yaml'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            docker:
              - 'Dockerfile*'
              - '.dockerignore'
              - '.hadolint.y*ml'
              - '.github/workflows/ci.yml'
            goreleaser:
              - '.goreleaser.y*ml'
              - 'Dockerfile.release'
              - '.github/workflows/ci.yml'
            integration:
              - 'integration/**'
              - 'compose.yaml'
              - 'Dockerfile*'
              - '.github/workflows/ci.yml'
            package-json:
              - 'package.json'
              - '.github/workflows/ci.yml'
            bun-lock:
              - 'package.json'
              - 'bun.lock'
              - 'cmd/hush-hush/web/package.json'
              - 'cmd/hush-hush/web/bun.lock'
              - '.github/workflows/ci.yml'
            # What scripts/test-ci.ts reads: the workflows, the hook, the images
            # and the versions it compares.
            ci-config:
              - '.github/workflows/**'
              - 'lefthook.yml'
              - 'scripts/test-ci.ts'
              - 'scripts/build-reports.sh'
              - 'scripts/test-build-reports.sh'
              - 'Dockerfile*'
              - 'go.mod'
              - 'package.json'
              - 'bun.lock'

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      # Version-pinned by the image tag itself, so there's nothing separate
      # to keep in sync with a golangci-lint-action version. This image is
      # built FROM golang, so `go` and `gofmt` are on PATH too.
      image: golangci/golangci-lint:v2.13.1@sha256:d371321370bf2907bd13a8f6f8baff0e0ca7438d76fdf636b281eadf7e2305e3
    steps:
      # actions/checkout is a JavaScript action and needs node; installing
      # git pulls in the need for ca-certificates too, since git reads the
      # system CA store a minimal image hasn't got.
      - run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache ca-certificates git nodejs
          else
            apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: golangci-lint fmt
        # --diff reports rather than rewrites here; this is the check that a
        # file was committed unformatted.
        run: golangci-lint fmt --diff
      - name: golangci-lint run
        run: golangci-lint run

  # Runs on every push to main, filter or not: `pages` replaces the whole
  # site on each deploy, and the reports it publishes come from this job.
  test:
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: golang:1.27.2-bookworm@sha256:5cf287a799e6b94384bad13d16b14904c531f51ba65792237e122ce42b392f61
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: go test
        # -coverpkg=./..., not the default: without it, coverage only counts
        # each package's own tests, and a thin handler package under-reports
        # since the logic it calls lives elsewhere. gotestsum wraps it for
        # the JUnit report Test Analytics needs.
        run: >-
          go tool gotestsum --junitfile junit.xml --
          -race -covermode=atomic -coverprofile=coverage.out -coverpkg=./... ./...
      - name: Report coverage
        run: |
          go tool cover -func=coverage.out | tail -1 |
            awk '{ print "**Coverage: " $3 "**" }' >> "$GITHUB_STEP_SUMMARY"
      - name: Build the coverage reports
        # Cobertura XML for tools that read it, and the HTML view for a
        # person. `pages` publishes both next to the JUnit file.
        run: |
          go tool gocover-cobertura < coverage.out > coverage.xml
          go tool cover -html=coverage.out -o coverage.html
      - name: Keep the reports for pages
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-reports
          path: |
            junit.xml
            coverage.out
            coverage.xml
            coverage.html
          if-no-files-found: error
          retention-days: 1
      - name: Upload coverage to Codecov
        # GitHub withholds repository Actions secrets from a Dependabot
        # pull_request run - CODECOV_TOKEN included - so this step would
        # otherwise fail every Dependabot PR with "token required because
        # branch is protected", regardless of what the PR actually
        # changes. go test above still ran and still gates the PR; only
        # the coverage report, which needs the missing token, is skipped.
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: true

  # Pact's Go binding statically links a native library into the test
  # binary at link time - present or not, whether or not a Pact test
  # actually runs - so this stays its own job rather than folding into
  # `test`, which has no such dependency and shouldn't gain one just
  # because this package now imports pact-go behind a build tag.
  #
  # Provider verification only, unlike before the CLI split: the consumer
  # side (internal/client) moved to hush-hush-cli along with the rest of
  # the client, and that repo verified live it doesn't reproduce this pact
  # suite (design.md's resolved open question - a hand-written fake
  # instead). pacts/*.json stays committed here as a frozen snapshot this
  # job keeps verifying the server against; nothing regenerates it going
  # forward.
  pact:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: golang:1.27.2-bookworm@sha256:5cf287a799e6b94384bad13d16b14904c531f51ba65792237e122ce42b392f61
    env:
      PACT_DO_NOT_TRACK: "true"
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Same version as go.mod: pact-go install fetches the native library that
      # matches the Go module, and a stale one fails at link time.
      - run: go install github.com/pact-foundation/pact-go/v2@v2.8.0
      - run: pact-go install
      - name: provider verification (reads pacts/*.json)
        run: go test -tags=pact ./internal/api/... -run TestPactProviderVerification -v

  build:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: golang:1.27.2-bookworm@sha256:5cf287a799e6b94384bad13d16b14904c531f51ba65792237e122ce42b392f61
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: go build ./...

  # No check-only flag on `go mod edit -fmt`, so this is the pre-commit
  # fixer's twin from lefthook.yml: run it again and diff.
  gomod:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: golang:1.27.2-bookworm@sha256:5cf287a799e6b94384bad13d16b14904c531f51ba65792237e122ce42b392f61
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: go mod edit -fmt
        run: go mod edit -fmt go.mod && git diff --exit-code go.mod
      - name: go mod tidy -diff
        # Broader than the -fmt check above: catches a stale require, a
        # non-canonical version string, or an orphaned go.sum entry that
        # -mod=readonly alone won't - go-mod.md's own reasoning for why
        # this is a separate, wider check kept out of pre-commit.
        run: go mod tidy -diff

  # goreleaser's config is validated here without cutting a release - a typo
  # in .goreleaser.yml otherwise only surfaces the day a release actually
  # runs. No container/Go toolchain needed: `check` only reads the config,
  # and goreleaser-action fetches a prebuilt, checksum-verified binary
  # instead of `go install`-ing the whole tool from source on every run.
  goreleaser:
    needs: changes
    if: needs.changes.outputs.goreleaser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.17.1
          args: check

  # hadolint runs as the job's own container rather than via `docker run`
  # from inside another one — no Docker-outside-of-Docker needed at all.
  # Must be the `-alpine` tag specifically: the default hadolint image is
  # `FROM scratch`, no shell, and can't run a checkout step.
  dockerfile:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552
    steps:
      # hadolint never shells out to git, so unlike every other job here it
      # doesn't need the safe.directory fix (or git installed at all).
      - run: apk add --no-cache nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: hadolint Dockerfile Dockerfile.release

  # No container: block, deliberately - testcontainers-go needs a real
  # Docker daemon to build and run against, which the bare runner already
  # has; a nested container job would need its own Docker-outside-of-Docker
  # setup for no benefit over just not nesting at all.
  container-integration:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.web-src == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -tags=integration ./integration/... -v

  # Layout and structure. Style and mechanics are prose.yml — see its header
  # comment for why they're split out.
  #
  # Pinned below 1.4, matching package.json's own packageManager: bun 1.4
  # made lockfileVersion 2 the default bun.lock format, and Dependabot's
  # bundled bun updater still ships 1.3.5, which can't parse it and
  # silently corrupts it back to v1 instead of erroring
  # (dependabot/dependabot-core#15848). Every bun job here stays on the
  # same pin so nothing writes a v2 lockfile out from under Dependabot.
  prose:
    needs: changes
    if: needs.changes.outputs.prose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache ca-certificates git nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: bun install
        # Frozen, so a drifted lockfile fails the job rather than silently
        # resolving to something nobody committed. --ignore-scripts skips
        # the `prepare` script (`lefthook install`) — hooks are a local dev
        # convenience with nothing to do in a one-shot CI container.
        run: bun install --frozen-lockfile --ignore-scripts
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  # The API description is a contract. This proves the document is valid
  # OpenAPI; nothing here proves the handler still matches it — see
  # CONTRIBUTING.md's "The contract" section for the gap.
  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache ca-certificates git nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: redocly lint
        run: bun run lint:api
      # What Redocly doesn't check: OWASP's API security rules. Findings the
      # server can't yet meet are waived in .spectral.yaml with the ticket.
      - name: spectral lint (OWASP)
        run: bun run lint:spectral

  # Renders the spec `api` just linted as a docs page (docs/api/index.html,
  # Scalar - alrayyes/dotfiles#646) and publishes it to GitHub
  # Pages. `needs: api` so a spec that fails Redocly never gets deployed;
  # `push`-only because `api` also runs on `pull_request`, where there's no
  # Pages environment to deploy into.
  #
  # The uploaded artifact mirrors docs/api/ and api/ at their real repo
  # paths rather than flattening either into the site root - index.html's
  # apiDescriptionUrl is a relative "../../api/openapi.yaml", and that only
  # resolves if the deployed layout matches the repo's. docs/api/llms.txt
  # rides along the same way, scoped to this subpath per llmstxt.org's own
  # spec - the site root (https://alrayyes.github.io/hush-hush/) has nothing
  # deployed to it, so there's no root-level llms.txt to write.
  pages:
    # Every other job in this workflow, so a red test or lint can't be
    # followed by a deploy: a failure that reports after the deploy started is
    # a shipped bug, not a caught one (rules/ci.md, "A deploy job depends on
    # every other job in its own pipeline"). Add a job here when you add one
    # above; a stale list fails quietly.
    #
    # Most of these are skipped when nothing they cover changed, and
    # `!failure() && !cancelled()` lets the deploy run past a skipped need
    # while still stopping on a failed or cancelled one (checked on GitHub,
    # alrayyes/Hush-Hush actions run 37135073068). `test` has to have run and
    # passed: it builds the reports this publishes, and a deploy replaces the
    # whole site, so one without them would delete the last set.
    needs:
      [
        changes,
        lint,
        test,
        pact,
        build,
        gomod,
        goreleaser,
        dockerfile,
        container-integration,
        prose,
        api,
        package-json,
        ci-config,
        web,
        e2e,
        lighthouse,
        advisories,
        commits,
      ]
    if: ${{ !failure() && !cancelled() && needs.test.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-reports
          path: _go-reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-reports
          path: _web-reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-reports
          path: _e2e-reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lighthouse-reports
          path: _lighthouse-reports
      - name: Stage the artifact
        env:
          LIGHTHOUSE_REPORTS: _lighthouse-reports
        run: |
          mkdir -p _site/docs/api _site/api
          cp docs/api/index.html _site/docs/api/index.html
          cp docs/api/llms.txt _site/docs/api/llms.txt
          cp api/openapi.yaml _site/api/openapi.yaml
          scripts/build-reports.sh _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
      - name: Check the published coverage report is live
        # The deploy succeeds whether or not the URL answers, so fetch the
        # real file. The retries cover the CDN catching up.
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output coverage.xml \
            "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml

  # package.json's own canonical shape - sort-package-json fills the same
  # role here that Prettier fills for everything else.
  package-json:
    needs: changes
    if: needs.changes.outputs.package-json == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache ca-certificates git nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint:package-json

  # The pipeline's own wiring (scripts/test-ci.ts): which jobs run for a change,
  # whether the pre-push hook runs the same ones, and the lists that go stale
  # when a job is added or renamed. rules/ci.md asks for one case per path.
  ci-config:
    needs: changes
    if: needs.changes.outputs.ci-config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
      options: --entrypoint ""
    steps:
      # bash: scripts/test-build-reports.sh runs under `bun run test:ci`.
      - run: apk add --no-cache ca-certificates git nodejs bash
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:ci

  # cmd/hush-hush/web is its own bun project, with its own package.json
  # and bun.lock - none of the bun-container jobs above touch it, they
  # all only ever install and run against this repo's root one. Nothing
  # here proved the frontend even builds until this job existed.
  # web, e2e and lighthouse run on every push to main, filter or not: `pages`
  # replaces the whole site on each deploy, and these jobs produce the web
  # half of its reports.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
      options: --entrypoint ""
    defaults:
      run:
        working-directory: cmd/hush-hush/web
    steps:
      # Overrides the job-level default above: this step runs before
      # checkout, so cmd/hush-hush/web doesn't exist on disk yet.
      - run: apk add --no-cache ca-certificates git nodejs
        working-directory: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bun install --frozen-lockfile
      - name: generated API types are current
        run: bun run generate:api:check
      - name: svelte-check
        run: bun run check
      - name: vitest
        # JUnit and a cobertura/html coverage report for `pages` to publish.
        # The node project only: the component project needs a real Chromium,
        # which this Alpine container can't run, so the e2e job runs it.
        run: >-
          bun run test --project server --coverage --reporter=default
          --reporter=junit --outputFile.junit=reports/unit.xml
      - name: Keep the vitest reports for pages
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-reports
          path: |
            cmd/hush-hush/web/reports/unit.xml
            cmd/hush-hush/web/coverage
          if-no-files-found: error
          retention-days: 1
      - name: biome check
        run: bun run lint
      - name: oxlint (@shadcn/lint)
        run: bun run lint:tailwind
      - name: vite build
        run: bun run build

  # e2e's webServer (e2e/server.sh) builds and runs the real Go binary -
  # the app has no SSR and every page's own +layout.ts fetches GET
  # /healthz at load, so a bare `vite preview` 500s on every route. A
  # plain ubuntu-latest runner rather than either bun-container job's
  # image above, since this is the one job that needs both toolchains at
  # once (go-releases.md's release job pairs the same two actions for the
  # same reason: goreleaser's own before.hooks build the frontend).
  #
  # Meant to block a merge (alrayyes/hush-hush#384). It's gated by the job-level
  # `if:` below, not by `on.pull_request.paths` at the trigger: ci.md's "never
  # require a status check gated behind paths" would leave every non-web
  # pull request permanently BLOCKED, since "never ran" isn't "passed" to
  # either forge. A job skipped by `if:` reports success, so a diff that
  # touches neither the frontend source nor the backend HTTP contract it
  # exercises (internal/api, the OpenAPI spec) still merges. A backend-only
  # auth change silently passing an e2e assertion it actually broke is exactly
  # the gap alrayyes/hush-hush#452 closes. Whether this job blocks a merge is a
  # branch-protection setting, not something this file decides.
  e2e:
    needs: changes
    if: needs.changes.outputs.web-tests == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
        working-directory: cmd/hush-hush/web
      - run: bun run build
        working-directory: cmd/hush-hush/web
      - run: bunx playwright install --with-deps chromium
        working-directory: cmd/hush-hush/web
      # Svelte components rendered in the Chromium just installed: what a
      # page shows and does, in milliseconds, so the journey below needn't.
      - name: component tests
        run: >-
          bun run test --project component --reporter=default
          --reporter=junit --outputFile.junit=reports/component.xml
        working-directory: cmd/hush-hush/web
      - run: bun run test:e2e
        working-directory: cmd/hush-hush/web
      - name: Keep the e2e report for pages
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            cmd/hush-hush/web/reports/e2e.xml
            cmd/hush-hush/web/reports/component.xml
          if-no-files-found: error
          retention-days: 1

  # rules/browser-compat.md's "warn, don't fail the build" applied to
  # Lighthouse, per alrayyes/hush-hush#384 - `e2e/lighthouse.ts` never
  # exits non-zero over a missed score threshold (only over the audit
  # itself crashing), so this job is deliberately never added to required
  # status checks. Same path-gating shape as `e2e` above, for the same
  # reason, even though "never required" means it wouldn't strictly need
  # it - no sense burning runner time on a pull request that never
  # touched the frontend.
  lighthouse:
    needs: changes
    if: needs.changes.outputs.web-tests == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
        working-directory: cmd/hush-hush/web
      - run: bun run build
        working-directory: cmd/hush-hush/web
      - run: bunx playwright install --with-deps chromium
        working-directory: cmd/hush-hush/web
      - name: Lighthouse audit (login, secrets overview - warns only)
        run: bun run lighthouse
        working-directory: cmd/hush-hush/web
      - name: Keep the Lighthouse reports for pages
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: cmd/hush-hush/web/reports/lighthouse
          if-no-files-found: error
          retention-days: 1

  # The pull request half of rules/dependencies.md: fail only on advisories
  # this change introduces over its base, so a newly published advisory
  # doesn't turn an unrelated pull request red. What is already on main is
  # advisory-scan.yml's, which keeps one ticket for it. govulncheck reports
  # only what the code can reach, so a Go change runs this as well as a
  # lockfile one. A job skipped by `if:` reports success, so this can be required.
  advisories:
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.bun-lock == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      # The Go the image ships with, not go.mod's: govulncheck audits whatever
      # standard library it runs on. scripts/test-ci.ts keeps this in step
      # with the Dockerfile.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - uses: alrayyes/advisory-scan@c9f794de4354b870e159510f036779baf20f4a2f # v0.3.1
        with:
          mode: gate
          setup: bun install --frozen-lockfile --ignore-scripts
          commands: |
            bun audit
            cd cmd/hush-hush/web && bun audit
            go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # A hook is something you can skip, and the version number depends on
  # these messages being right, so the whole branch is checked here too.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache ca-certificates git nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  # The one required check for this workflow (rules/ci.md, "A job that `needs`
  # a skipped job is skipped too"). Branch protection lists this instead of
  # each job, so renaming or splitting a job above can't leave an orphaned
  # required context behind, and a failed `changes` job fails this one rather
  # than turning everything it gates green by skipping it.
  #
  # `always()` so it reports even when a need failed. alls-green fails on a
  # failed or cancelled need and on a skipped one that isn't allowed: every
  # filtered job may skip, `changes` may not. `pages` is the deploy and
  # needs the jobs above, so it can't be waited on here; `lighthouse` warns
  # and is deliberately never required (see its own comment). Add a job to
  # `needs` and `allowed-skips` when you add one above.
  all-green:
    if: always()
    needs:
      [
        changes,
        lint,
        test,
        pact,
        build,
        gomod,
        goreleaser,
        dockerfile,
        container-integration,
        prose,
        api,
        package-json,
        ci-config,
        web,
        e2e,
        advisories,
        commits,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: lint, test, pact, build, advisories, gomod, goreleaser, dockerfile, container-integration, prose, api, package-json, ci-config, web, e2e, commits
