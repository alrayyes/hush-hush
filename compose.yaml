# `docker compose up` pulls the published image, pinned by tag and digest like
# every other image here. To build from the local Dockerfile instead, add the
# override: `docker compose -f compose.yaml -f compose.build.yaml up --build`.
# It's a separate file because a build can't be tagged with a digest, so a
# `build:` beside this pinned `image:` would break `up --build`.
#
# DB_PATH points at the named volume below rather than :memory: - a
# write-path token is issued by running the image's own binary again
# against that file (`docker compose exec hush-hush /hush-hush token
# issue --description ...`), which needs a real, persistent file to find.
# The volume comes up already writable by nonroot (UID 65532): Docker
# seeds a freshly created named volume from the image directory it's
# mounted over, ownership included, and the Dockerfile bakes that
# ownership into /data for exactly this reason - no separate chown step.
services:
  hush-hush:
    image: ghcr.io/alrayyes/hush-hush:3.38.4@sha256:c13f05209e9959b4aec23d066235f2367ff5eb4ef2a3cbaa92d329d31dadbf92
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_PATH: "/data/hush-hush.db"
    volumes:
      - hush-hush-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 64m
    cpus: 0.5

volumes:
  hush-hush-data:
