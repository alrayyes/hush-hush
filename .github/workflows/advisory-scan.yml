# The scan half of rules/dependencies.md: audit main and keep one open
# "Dependency advisories" issue that lists what's there. Daily for advisories
# published against pins that haven't moved, on a dependency push so a merged
# fix closes the ticket at once, and by hand. An audit that errors (registry
# down) fails the job and leaves the ticket alone. The pull request half is
# the `advisories` job in ci.yml.
#
# govulncheck reports only what the code can reach, so a Go source push scans
# too.
name: advisory-scan

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - cmd/hush-hush/web/package.json
      - cmd/hush-hush/web/bun.lock
      - go.mod
      - go.sum
      - "**/*.go"
      - .github/workflows/advisory-scan.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      # The Go the image ships with, not go.mod's: govulncheck audits whatever
      # standard library it runs on. scripts/test-ci.ts keeps this in step
      # with the Dockerfile.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
      - uses: alrayyes/advisory-scan@c9f794de4354b870e159510f036779baf20f4a2f # v0.3.1
        with:
          mode: scan
          setup: bun install --frozen-lockfile --ignore-scripts
          commands: |
            bun audit
            cd cmd/hush-hush/web && bun audit
            go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          labels: dependencies
